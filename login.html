<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Góc Nhóm Ẩn Danh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Phòng Chat Nhóm</h3>
        <div id="alertBox" class="alert d-none" role="alert"></div>
        <form id="authForm">
            <div class="mb-3">
                <label class="form-label">Tên tài khoản</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" id="btnLogin">Đăng Nhập</button>
            <button type="button" class="btn btn-outline-secondary w-100" id="btnRegister">Đăng Ký</button>
        </form>
    </div>

    <script>
        const showAlert = (msg, type) => {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.innerText = msg;
            box.classList.remove('d-none');
        };

        document.getElementById('btnLogin').onclick = async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('currentUser', data.username);
                window.location.href = '/chat.html';
            } else {
                showAlert(data.error, 'danger');
            }
        };

        document.getElementById('btnRegister').onclick = async () => {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return showAlert('Vui lòng nhập đủ thông tin!', 'warning');
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(data.success) {
                showAlert('Đăng ký thành công, hãy bấm Đăng Nhập!', 'success');
            } else {
                showAlert(data.error, 'danger');
            }
        };
    </script>
</body>
</html>
